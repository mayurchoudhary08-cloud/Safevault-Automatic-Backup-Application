name: Windows Desktop Release Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "SafeVault" --collect-all customtkinter main.py

      - name: Package standalone zip archive
        run: |
          Compress-Archive -Path "dist/SafeVault" -DestinationPath "SafeVault-Windows-x64.zip" -Force

      - name: Upload Windows Standalone Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeVault-Windows-x64
          path: SafeVault-Windows-x64.zip
          retention-days: 90

      - name: Attach to GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SafeVault-Windows-x64.zip
